<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alec Morgana</title>
  <meta name="description" content="Alec Morgana — personal links" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    main {
      width: 100%;
      max-width: 28rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    p.tagline {
      color: #8a8f98;
      font-size: 1rem;
      margin-bottom: 2.5rem;
    }

    ul.links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    ul.links a {
      display: block;
      padding: 0.9rem 1.25rem;
      background: #1c1f26;
      border: 1px solid #2a2e38;
      border-radius: 12px;
      color: #f5f5f7;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
    }

    ul.links a:hover,
    ul.links a:focus {
      background: #262a33;
      border-color: #3a3f4b;
      outline: none;
    }

    ul.links a:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #5a5f68;
    }

    @media (prefers-color-scheme: light) {
      html, body { background: #ffffff; color: #1a1a1a; }
      p.tagline { color: #666; }
      ul.links a {
        background: #f5f5f7;
        border-color: #e5e5ea;
        color: #1a1a1a;
      }
      ul.links a:hover,
      ul.links a:focus {
        background: #ebebef;
        border-color: #d5d5da;
      }
      footer { color: #999; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Alec Morgana</h1>
    <p class="tagline">🇨🇦 Vancouver, BC</p>
    <ul class="links">
      <li><a href="https://www.linkedin.com/in/alecmorgana" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      <li><a href="https://x.com/alecmorgana" target="_blank" rel="noopener noreferrer">X / Twitter</a></li>
      <li><a href="https://www.instagram.com/alecmorgana/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      <li><a href="https://www.facebook.com/alecmorgana" target="_blank" rel="noopener noreferrer">Facebook</a></li>
      <li><a href="https://www.youtube.com/alecmorgana" target="_blank" rel="noopener noreferrer">YouTube</a></li>
    </ul>
    <footer>&copy; <span id="year"></span> Alec Morgana</footer>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
